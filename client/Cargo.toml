[package]
name = "backroom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backroom voice chat client with neural noise suppression"

[lib]
name = "backroom_client"
path = "src/lib.rs"

[[bin]]
name = "backroom"
path = "src/main.rs"

[dependencies]
backroom-proto = { path = "../proto" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
cpal = "0.18"
opus = "0.4"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
eframe = "0.37"
device_query = "4"
crossbeam-channel = "0.5"
rtrb = "0.3"
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hound = "3.5"
backroom-server = { path = "../server" }
