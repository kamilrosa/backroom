# Backroom server on a Raspberry Pi (or any Linux box).
#
#   1. Copy .env.example to .env and set the password.
#   2. docker compose up -d   (pulls the ready-made image for your architecture)
#   3. On your router, forward UDP port 7777 to the Pi.
#
# To use an image built from source instead, build it under the same name:
#   docker build -t ghcr.io/kamilrosa/backroom-server .
services:
  backroom:
    image: ghcr.io/kamilrosa/backroom-server:latest
    container_name: backroom
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    env_file: .env
    volumes:
      - backroom-data:/data
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  backroom-data:
